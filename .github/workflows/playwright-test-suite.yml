name: Playwright Test Suite

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:
    inputs:
      pytest_marker:
        description: 'Pytest marker expression to run'
        required: false
        default: 'smoke'
      browser:
        description: 'Browser to run tests against'
        required: false
        default: 'chromium'
      headless:
        description: 'Run in headless mode'
        required: false
        default: 'true'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_MARKER: ${{ github.event.inputs.pytest_marker || 'smoke' }}
      BASE_URL: ${{ secrets.BASE_URL }}
      HEADLESS: ${{ github.event.inputs.headless || 'true' }}
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Show versions
        run: |
          python --version
          pip --version
          pytest --version
          python -m playwright --version

      - name: Run pytest suite
        run: |
          mkdir -p artifacts
          echo "Running marker: ${PYTEST_MARKER}"
          pytest -m "${PYTEST_MARKER}" --junitxml=artifacts/junit.xml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/**
            screenshots/**
            reports/**
            logs/**
            **/*.png
            **/*.jpg
            **/*.jpeg
            **/*.webm
            **/*.mp4
            **/*.zip

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Playwright Test Suite"
            echo ""
            echo "- Marker: `${PYTEST_MARKER}`"
            echo "- Browser: `${BROWSER}`"
            echo "- Headless: `${HEADLESS}`"
            echo "- Ref: `${GITHUB_REF}`"
            echo "- SHA: `${GITHUB_SHA}`"
          } >> "$GITHUB_STEP_SUMMARY"
