[pytest]
addopts = -ra --tb=short --strict-markers --html=artifacts/report.html --self-contained-html
markers =
    smoke: smoke coverage for public Salesforce Experience Cloud pages
    auth: tests requiring authenticated user flows
    regression: authenticated business workflow and form validation coverage
    slow: longer-running tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
